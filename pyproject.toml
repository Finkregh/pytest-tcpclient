[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-tcpclient"
authors = [{ name = "Anders Lindstrom", email = "anders@anderslindstrom.com" }]
description = "A pytest plugin for testing TCP clients"
readme = ".github/README.rst"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version", "optional-dependencies"]
dependencies = ["pytest>8", "pytest-asyncio", "pytest-mock"]

[project.urls]
"Homepage" = "https://github.com/andersglindstrom/pytest-tcpclient.git"

[project.entry-points.pytest11]
tcpclient = "pytest_tcpclient.plugin"

[tool.pytest.ini_options]
pytester_example_dir = "examples"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
asyncio_debug = true
asyncio_mode = "auto"
addopts = "--color=yes --cov=src --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report=lcov:lcov.info --cov-report=term-missing --cov-append --cov-fail-under=75"

[tool.setuptools_scm]

[tool.setuptools.dynamic.optional-dependencies.dev]
file = "dev_dependencies.txt"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["examples/**", "setup.py", "docs/**", "conftest.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D407",   # Missing dashed underline after section ("Returns") # formatting docstrings
    "FA102",  # future-required-type-annotation (FA102) # we dont use old python
    "FA100",  # see above
    "UP015",  # Unnecessary open mode parameters
    "PTH123", # `open()` should be replaced by `Path.open()`
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"{tests,examples}/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG",  # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "E501",    # line-too-long # often test strings are longer
    "T201",    # print allowed
    "ERA001",  # Found commented-out code
]

[tool.ruff.lint.isort]
known-first-party = ["pytest_tcpclient"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.paths]
source = ["src"]
tests = ["tests", "*/tests"]
